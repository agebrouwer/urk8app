<mat-sidenav-container class="sidenav-container app">
  <mat-sidenav #drawer class="sidenav" mode="side" [opened]="false">
    <mat-nav-list>
      <a mat-list-item routerLink="home" (click)="drawer.close()">Home</a>
      <a mat-list-item routerLink="contact" (click)="drawer.close()">Contact</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
      >
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>Showcase App</span>
    </mat-toolbar>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
