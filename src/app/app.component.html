<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" mode="side" closed>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/home"
        routerLinkActive="active-link"
        (click)="navigateStyling('Home')"
      >
        Home
      </a>
      <a
        mat-list-item
        routerLink="/contact"
        routerLinkActive="active-link"
        (click)="navigateStyling('Contact')"
      >
        Contact
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        mat-icon-button
        (click)="drawer.toggle()"
        aria-label="Toggle sidenav"
        id="toggleButton"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span>{{ title }}</span>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
