<div class="contact-container">
    <h2>Contact Us</h2>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="name">Name:</label>
        <input id="name" type="text" formControlName="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email:</label>
        <input id="email" type="email" formControlName="email" required>
      </div>
      <div class="form-field">
        <label for="phone">Phone:</label>
        <input id="phone" type="text" formControlName="phone">
      </div>
      <div class="form-field">
        <label for="message">Message:</label>
        <textarea id="message" rows="5" formControlName="message" required></textarea>
      </div>
      <!-- Google reCAPTCHA widget -->
      <div class="form-field captcha">
        <div class="g-recaptcha" data-sitekey="6Ldh89QqAAAAAIRe2d40ba28cBEg5HHIkDxXLqz8" data-callback="resolvedCaptcha"></div>
      </div>
      <div class="form-field">
        <button type="submit" [disabled]="!contactForm.valid || !captchaToken">Submit</button>
      </div>
    </form>
  </div>
